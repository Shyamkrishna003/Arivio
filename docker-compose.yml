services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arivio-postgres
    environment:
      POSTGRES_DB: arivio
      POSTGRES_USER: arivio
      POSTGRES_PASSWORD: arivio_dev
    ports:
      # Published on 5433 so it does not clash with a local PostgreSQL on 5432.
      # Inside the compose network other services still reach it on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arivio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arivio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: arivio-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      # Optional: supplies AI_API_KEY and any other local overrides. The
      # `environment` block below still wins for anything it sets.
      - path: ./backend/.env
        required: false
    environment:
      # Service names, not localhost — these are resolved on the compose network.
      DATABASE_URL: postgresql+asyncpg://arivio:arivio_dev@postgres:5432/arivio
      REDIS_URL: redis://redis:6379/0
      # The browser origin, which is the host's port mapping rather than the
      # container's. Parsed as JSON because CORS_ORIGINS is a list[str].
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount for hot reload. The anonymous volumes below stop the host's
      # venv and caches from shadowing the image's site-packages.
      - ./backend:/app
      - /app/venv
      - /app/.mypy_cache
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: arivio-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Resolved by the browser, so it points at the published host port.
      VITE_API_URL: http://localhost:8000/api/v1
      # Serve plain HTTP: an HTTPS page calling the HTTP backend would be
      # blocked as mixed content.
      VITE_HTTPS: "false"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  redis_data:
